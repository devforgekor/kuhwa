name: Update NEIS schedule data

on:
  schedule:
    - cron: "0 1 * * *"   # 매일 KST 10:00 (UTC 01:00)
    - cron: "0 5 * * *"   # 매일 KST 14:00 (UTC 05:00)
    - cron: "0 8 * * *"   # 매일 KST 17:00 (UTC 08:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-save nodemailer

      - name: Fetch NEIS schedule
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/fetch-schedule.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update NEIS schedule data"
            git push
          fi
