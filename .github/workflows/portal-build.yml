name: Portal build & deploy

on:
  push:
    branches: [main]
    paths: ["apps/portal/**", "!apps/portal/dist/**"]   # dist는 산출물이므로 제외 (계획서4.3)
  workflow_dispatch: {}

concurrency:
  group: portal-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # 규칙8(version bump 경고)의 HEAD~1 비교용
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (검증 게이트)
        run: node apps/portal/build.mjs
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          printf 'Host kuhwa\n  HostName 161.33.199.207\n  User %s\n  StrictHostKeyChecking no\n' "${{ secrets.KUHWA_DEPLOY_USER }}" > ~/.ssh/config
          echo "${{ secrets.KUHWA_SSH_KEY }}" > key && chmod 600 key
          rsync -avz --delete -e "ssh -i key -o StrictHostKeyChecking=no" \
            apps/portal/dist/ kuhwa:/var/www/kuhwa/
          rm -f key
