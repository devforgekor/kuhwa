name: Portal build & deploy

on:
  push:
    branches: [main]
    paths: ["apps/portal/**", "!apps/portal/dist/**"]   # dist는 산출물이므로 제외 (계획서4.3)
  workflow_dispatch: {}

concurrency:
  group: portal-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # 규칙8(version bump 경고)의 HEAD~1 비교용
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (검증 게이트)
        run: node apps/portal/build.mjs
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          printf 'Host kuhwa\n  HostName 161.33.199.207\n  User %s\n  StrictHostKeyChecking no\n' "${{ secrets.KUHWA_DEPLOY_USER }}" > ~/.ssh/config
          echo "${{ secrets.KUHWA_SSH_KEY }}" > key && chmod 600 key
          # -a 금지: 대상 루트(/var/www/kuhwa)는 root 소유 → chgrp/chmod/utime 전부 EPERM(exit 23).
          # CI 배포는 소유자·권한·시간 보존 불필요 → 속성 off, 신규 파일은 setgid dir로 www-data 상속.
          rsync -rlz --delete --no-owner --no-group --no-perms --no-times \
            -e "ssh -i key -o StrictHostKeyChecking=no" apps/portal/dist/ kuhwa:/var/www/kuhwa/
          rm -f key
