<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국구화학교 학사일정</title>
<style>
  :root {
    --primary: #1d4ed8;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --today: #fef3c7;
    --holiday: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 24px 20px;
    text-align: center;
  }
  header p {
    margin: 0;
    opacity: 1;
    font-size: clamp(15px, 4.5vw, 22px);
    font-weight: 700;
    white-space: nowrap;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
    margin-bottom: 16px;
  }
  .controls button {
    border: 1px solid var(--border);
    background: var(--card);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .controls button:hover { background: #eef2ff; }
  .controls .month-label {
    font-size: 18px;
    font-weight: 700;
    min-width: 100px;
    text-align: center;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cal-sub {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 12px;
    margin-top: 14px;
  }
  .cal-sub-btn {
    font-size: 12px;
    color: var(--primary);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    background: var(--card);
  }
  .cal-sub-btn:hover { background: #eef2ff; }
  .status { text-align: center; color: var(--muted); padding: 40px 0; }
  .calendar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #f1f5f9;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .weekdays div {
    padding: 8px 4px;
    text-align: center;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .weekdays div:nth-child(7n) { border-right: none; }
  .weekdays div:first-child { color: #dc2626; }
  .weekdays div:last-child { color: #2563eb; }
  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .day-cell {
    min-height: 84px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px;
    font-size: 12px;
    vertical-align: top;
  }
  .day-cell:nth-child(7n) { border-right: none; }
  .day-cell.empty { background: #fafafa; }
  .day-cell.today { background: var(--today); }
  .day-num {
    font-weight: 700;
    margin-bottom: 4px;
  }
  .day-cell.sunday .day-num { color: #dc2626; }
  .day-cell.saturday .day-num { color: #2563eb; }
  .event-chip {
    background: #dbeafe;
    color: #1e3a8a;
    border-radius: 5px;
    padding: 2px 4px;
    margin-bottom: 2px;
    font-size: 10px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-chip.holiday {
    background: #fee2e2;
    color: #991b1b;
  }
  .leave-note {
    margin-top: 14px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    background: #eff6ff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 30px 0;
  }
  @media (max-width: 480px) {
    header { padding: 18px 12px; }
    .day-cell { min-height: 62px; font-size: 10px; }
    .weekdays { font-size: 10px; }
    .weekdays div { padding: 6px 2px; }
    .event-chip { font-size: 9px; }
    .controls { gap: 8px 10px; }
    .controls button { padding: 7px 10px; font-size: 13px; }
    .controls .month-label { font-size: 16px; min-width: 90px; }
  }
  @media (max-width: 360px) {
    header { padding: 16px 10px; }
    .day-cell { font-size: 9px; }
    .weekdays { font-size: 9px; }
    .weekdays div { padding: 5px 1px; }
    .controls button { padding: 6px 8px; font-size: 12px; }
    .controls .month-label { font-size: 15px; min-width: 80px; }
  }
</style>
</head>
<body>
  <header>
    <p id="schoolYearLabel">불러오는 중...</p>
  </header>
  <main>
    <div class="controls">
      <button id="prevBtn">‹ 이전달</button>
      <div class="month-label" id="monthLabel">-</div>
      <button id="nextBtn">다음달 ›</button>
    </div>
    <div id="content" class="status">학사일정을 불러오는 중입니다...</div>
  </main>
  <footer>데이터 출처: 나이스(NEIS) 교육정보 개방 포털</footer>

  <script>
    const contentEl = document.getElementById("content");
    const monthLabelEl = document.getElementById("monthLabel");
    const yearLabelEl = document.getElementById("schoolYearLabel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const icsUrl = window.location.origin + "/api/calendar.ics";
    const webcalUrl = icsUrl.replace(/^https?:\/\//, "webcal://");
    const gcalUrl = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(webcalUrl);

    // 현재 한국(KST, UTC+9) 기준 날짜를 계산합니다.
    function getKstNow() {
      const utcMs = Date.now();
      return new Date(utcMs + 9 * 60 * 60 * 1000);
    }

    const kstNow = getKstNow();
    let viewYear = kstNow.getUTCFullYear();
    let viewMonth = kstNow.getUTCMonth() + 1; // 1~12
    const todayYear = kstNow.getUTCFullYear();
    const todayMonth = kstNow.getUTCMonth() + 1;
    const todayDate = kstNow.getUTCDate();

    const cache = new Map(); // year -> events[]

    function pad2(n) { return String(n).padStart(2, "0"); }

    async function fetchYear(year) {
      if (cache.has(year)) return cache.get(year);
      // 매일 새벽(KST 07:00) GitHub Actions가 미리 생성해 둔 정적 데이터를 읽어옵니다.
      // (실시간 NEIS API 호출이 없어 훨씬 빠르게 로딩됩니다.)
      let events = [];
      try {
        const res = await fetch(`/data/${year}.json`);
        if (res.ok) {
          const data = await res.json();
          events = data.events || [];
        }
      } catch (err) {
        events = [];
      }
      if (events.length === 0) {
        // 정적 파일이 없거나 비어있는 경우(생성 전 등) 실시간 API로 대체합니다.
        const res = await fetch(`/api/schedule?year=${year}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "요청 실패");
        events = data.events || [];
      }
      cache.set(year, events);
      return events;
    }

    function daysInMonth(year, month) {
      return new Date(Date.UTC(year, month, 0)).getUTCDate();
    }

    function renderCalendar(year, month, events) {
      contentEl.className = "";
      monthLabelEl.textContent = `${year}년 ${month}월`;
      const schoolYear = month >= 3 ? year : year - 1;
      yearLabelEl.textContent = `${schoolYear}학년도 한국구화학교 학사일정`;

      const firstWeekday = new Date(Date.UTC(year, month - 1, 1)).getUTCDay(); // 0=일
      const totalDays = daysInMonth(year, month);

      const eventsByDay = new Map();
      const ymdPrefix = `${year}${pad2(month)}`;
      events.forEach((ev) => {
        if (ev.date.startsWith(ymdPrefix)) {
          const d = parseInt(ev.date.slice(6, 8), 10);
          if (!eventsByDay.has(d)) eventsByDay.set(d, []);
          eventsByDay.get(d).push(ev);
        }
      });

      const cal = document.createElement("div");
      cal.className = "calendar";

      const weekdaysRow = document.createElement("div");
      weekdaysRow.className = "weekdays";
      ["일", "월", "화", "수", "목", "금", "토"].forEach((w) => {
        const d = document.createElement("div");
        d.textContent = w;
        weekdaysRow.appendChild(d);
      });
      cal.appendChild(weekdaysRow);

      const daysGrid = document.createElement("div");
      daysGrid.className = "days";

      let workdayCount = 0;

      for (let i = 0; i < firstWeekday; i++) {
        const cell = document.createElement("div");
        cell.className = "day-cell empty";
        daysGrid.appendChild(cell);
      }

      for (let d = 1; d <= totalDays; d++) {
        const weekday = (firstWeekday + d - 1) % 7;
        const cell = document.createElement("div");
        cell.className = "day-cell";
        if (weekday === 0) cell.classList.add("sunday");
        if (weekday === 6) cell.classList.add("saturday");
        if (year === todayYear && month === todayMonth && d === todayDate) {
          cell.classList.add("today");
        }

        const num = document.createElement("div");
        num.className = "day-num";
        num.textContent = d;
        cell.appendChild(num);

        const dayEvents = eventsByDay.get(d) || [];
        // 달력에는 나이스(NEIS) 학사일정 데이터를 그대로 보여줍니다.
        const isHolidayEvent = (ev) => (ev.type || "").includes("공휴일") || (ev.type || "").includes("휴업일");
        if (weekday !== 0 && weekday !== 6 && !dayEvents.some(isHolidayEvent)) {
          workdayCount += 1;
        }
        dayEvents.forEach((ev) => {
          const chip = document.createElement("div");
          const isHoliday = isHolidayEvent(ev);
          chip.className = "event-chip" + (isHoliday ? " holiday" : "");
          chip.textContent = ev.name;
          chip.title = `${ev.name}${ev.type ? " (" + ev.type + ")" : ""}`;
          cell.appendChild(chip);
        });

        daysGrid.appendChild(cell);
      }

      const trailingCount = (7 - ((firstWeekday + totalDays) % 7)) % 7;
      for (let i = 0; i < trailingCount; i++) {
        const cell = document.createElement("div");
        cell.className = "day-cell empty";
        daysGrid.appendChild(cell);
      }

      cal.appendChild(daysGrid);

      const maxLeaveDays = Math.max(workdayCount - 15, 0);
      const leaveNote = document.createElement("div");
      leaveNote.className = "leave-note";
      leaveNote.textContent = `당월 최대 연가 사용: ${maxLeaveDays}회`;

      const calSub = document.createElement("div");
      calSub.className = "cal-sub";
      const gcalBtn = document.createElement("a");
      gcalBtn.id = "gcalBtn";
      gcalBtn.className = "cal-sub-btn";
      gcalBtn.target = "_blank";
      gcalBtn.rel = "noopener";
      gcalBtn.href = gcalUrl;
      gcalBtn.textContent = "구글 캘린더에 추가";
      const icsBtn = document.createElement("a");
      icsBtn.id = "icsBtn";
      icsBtn.className = "cal-sub-btn";
      icsBtn.target = "_blank";
      icsBtn.rel = "noopener";
      icsBtn.href = icsUrl;
      icsBtn.textContent = "ICS 파일 구독 링크";
      calSub.appendChild(gcalBtn);
      calSub.appendChild(icsBtn);

      contentEl.innerHTML = "";
      contentEl.appendChild(cal);
      contentEl.appendChild(leaveNote);
      contentEl.appendChild(calSub);
    }

    async function loadMonth(year, month) {
      contentEl.className = "status";
      contentEl.textContent = "학사일정을 불러오는 중입니다...";
      try {
        const events = await fetchYear(year);
        renderCalendar(year, month, events);
      } catch (err) {
        contentEl.className = "status";
        contentEl.textContent = "학사일정을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
      }
    }

    prevBtn.addEventListener("click", () => {
      viewMonth -= 1;
      if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
      loadMonth(viewYear, viewMonth);
    });
    nextBtn.addEventListener("click", () => {
      viewMonth += 1;
      if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
      loadMonth(viewYear, viewMonth);
    });

    loadMonth(viewYear, viewMonth);
  </script>
</body>
</html>
