<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · 예산 내역</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-white min-h-screen">
  <nav class="kb-topbar">
    <a class='logo' href='/'>kuhwa</a>
    <span class="app">예산 내역</span>
    <span class="spacer"></span>
  </nav>
  <main class="kb-main">
    <div class="kb-head">
      <h1>현금출납부</h1>
      <p class="lead">비밀번호를 입력하여 예산 내역을 확인합니다</p>
    </div>

    {% if error %}
    <p class="kb-error">{{ error }}</p>
    {% endif %}

    <div class="kb-card" style="max-width: 420px">
      <form method="post" action="/login">
        <div class="kb-field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" required autofocus>
        </div>
        <button type="submit" class="kb-btn">로그인</button>
      </form>
    </div>
  </main>
  <footer class="kb-foot">© kuhwa · 예산 내역 · <a href='/'>서비스 목록</a></footer>
</body>
</html>
